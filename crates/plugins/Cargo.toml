[package]
name = "peephole-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Peephole plugins: clock, demo, declarative prometheus and http_json recipes, and direct readers for Proxmox, Kubernetes, UniFi, Uptime Kuma, Home Assistant, Technitium, Forgejo, GitHub, WAHA, CLIProxyAPI, Homepage, Homarr, X and more"

[dependencies]
peephole-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
reqwest.workspace = true
image.workspace = true
tokio-tungstenite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

[dev-dependencies]
wiremock.workspace = true
