# Peephole: a whole homelab on a 320x170 screen. Thirty pages: thirteen fed by Prometheus
# (kube-state-metrics, node exporter, a Proxmox exporter, UnPoller, nvidia-smi, blackbox probes,
# Velero, CloudNativePG, a Cloudflare exporter) and a mempool.space-compatible API, sixteen fed by
# direct plugins (Proxmox, Kubernetes, UniFi Network, Uptime Kuma, CLIProxyAPI, Home Assistant,
# Technitium, Forgejo, GitHub, WAHA, Homepage, Homarr, Radarr/Sonarr/Lidarr/Prowlarr, qBittorrent,
# job-scout, X). Names (clusters, hosts, zones, guests, devices) are placeholders: rename the `items`
# and `rename` maps to yours; every URL and credential is an environment variable.
# With this many pages give each device a page list (POST /api/devices/{id}/pages or the /settings panel).
hub:
  title: Homelab
  cycle_s: 12
  stale_s: 600

plugins:
  - kind: clock
    tz: ${PEEPHOLE_TZ:-UTC}

  - kind: mempool
    name: btc
    url: ${MEMPOOL_URL}
    interval_s: 60

  - kind: prometheus
    name: p
    url: ${PROMETHEUS_URL}
    interval_s: 60
    timeout_s: 15
    queries:
      # AI gateway quota (ratios 0–1) and usage
      - {key: claude5h, expr: 'min(cliproxy_quota_remaining_ratio{provider="claude",window="five_hour"})'}
      - {key: claude7d, expr: 'min(cliproxy_quota_remaining_ratio{provider="claude",window="seven_day"})'}
      - {key: codex5h, expr: 'min(cliproxy_quota_remaining_ratio{provider="codex",window="five_hour"})'}
      - {key: agent7d, expr: 'min(cliproxy_quota_remaining_ratio{provider="antigravity",window="claude_gpt_weekly"})'}
      - {key: xai7d, expr: 'min(cliproxy_quota_remaining_ratio{provider="xai",window="weekly"})'}
      - {key: aireq, expr: 'sum by (provider) (increase(cliproxy_requests_total[24h]))', label: provider}
      - {key: aitok, expr: 'sum by (provider) (increase(cliproxy_tokens_total[24h]))', label: provider}
      - {key: ai_req_hourly, expr: 'sum(rate(cliproxy_requests_total[1h])) * 3600', range: {span_s: 86400, step_s: 3600}}
      - {key: alerts, expr: 'sum(grafana_alerting_alertmanager_alerts{state="active"})'}
      # Websites (Cloudflare exporter)
      - {key: req24h, expr: 'sum by (zone) (sum_over_time(cloudflare_zone_requests[24h:1h]))', label: zone}
      - {key: uniq24h, expr: 'sum by (zone) (sum_over_time(cloudflare_zone_uniques[24h:1h]))', label: zone}
      - {key: threats, expr: 'sum by (zone) (cloudflare_zone_threats)', label: zone}
      - {key: tunnels_up, expr: 'sum(cloudflare_tunnel_up)'}
      - {key: tunnels, expr: 'count(cloudflare_tunnel_up)'}
      - {key: web_req_hourly, expr: 'sum(cloudflare_zone_requests)', range: {span_s: 86400, step_s: 3600}}
      # Bitcoin node (exporter next to bitcoind)
      - {key: node_blocks, expr: 'max(bitcoin_blocks)'}
      - {key: node_peers, expr: 'max(bitcoin_peers)'}
      - {key: node_mempool, expr: 'max(bitcoin_mempool_size)'}
      # Kubernetes clusters (kube-state-metrics with a `cluster` label)
      - {key: ready, expr: 'sum by (cluster) (kube_node_status_condition{condition="Ready",status="true"})', label: cluster}
      - {key: nodes, expr: 'count by (cluster) (kube_node_info)', label: cluster}
      - {key: pods, expr: 'sum by (cluster) (kube_pod_status_phase{phase="Running"})', label: cluster}
      - {key: badpods, expr: 'sum by (cluster) (kube_pod_status_phase{phase=~"Pending|Failed|Unknown"})', label: cluster}
      - {key: mem, expr: '1 - sum by (cluster) (node_memory_MemAvailable_bytes{cluster!~"nas|proxmox"}) / sum by (cluster) (node_memory_MemTotal_bytes{cluster!~"nas|proxmox"})', label: cluster}
      - {key: badpods_hourly, expr: 'sum(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"})', range: {span_s: 86400, step_s: 3600}}
      # Proxmox hosts (pve exporter)
      - {key: hcpu, expr: 'max by (instance) (pve_cpu_usage_ratio{id=~"node/.*"})', label: instance}
      - {key: hmem, expr: 'max by (instance) (pve_memory_usage_bytes{id=~"node/.*"}) / max by (instance) (pve_memory_size_bytes{id=~"node/.*"})', label: instance}
      - {key: hnvme, expr: 'max by (instance) (pve_nvme_temperature_celsius)', label: instance}
      - {key: huptime, expr: 'max by (instance) (pve_uptime_seconds{id=~"node/.*"})', label: instance}
      - {key: hguests, expr: 'count by (instance) (pve_up{id=~"(qemu|lxc)/.*"} == 1)', label: instance}
      - {key: hzfs, expr: 'min by (instance) (pve_zfs_pool_free_bytes / pve_zfs_pool_size_bytes)', label: instance}
      - {key: hcpu_1h, expr: 'max by (instance) (pve_cpu_usage_ratio{id=~"node/.*"})', label: instance, range: {span_s: 3600, step_s: 120}}
      # GPU node (nvidia-smi exporter; the uuid label's first four characters name the card)
      # `rename` maps the first four characters of each card's uuid to a name used in the pages
      - {key: gtemp, expr: 'label_replace(nvidia_smi_temperature_gpu, "card", "$1", "uuid", "(....).*")', label: card, rename: {aaaa: card-a, bbbb: card-b}}
      - {key: gpower, rename: {aaaa: card-a, bbbb: card-b}, expr: 'label_replace(nvidia_smi_power_draw_watts, "card", "$1", "uuid", "(....).*")', label: card}
      - {key: gplimit, rename: {aaaa: card-a, bbbb: card-b}, expr: 'label_replace(nvidia_smi_power_limit_watts, "card", "$1", "uuid", "(....).*")', label: card}
      - {key: gutil, rename: {aaaa: card-a, bbbb: card-b}, expr: 'label_replace(nvidia_smi_utilization_gpu_ratio, "card", "$1", "uuid", "(....).*")', label: card}
      - {key: gvram, rename: {aaaa: card-a, bbbb: card-b}, expr: 'label_replace(nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes, "card", "$1", "uuid", "(....).*")', label: card}
      - {key: gtemp_1h, expr: 'label_replace(nvidia_smi_temperature_gpu, "card", "$1", "uuid", "(....).*")', label: card, rename: {aaaa: card-a, bbbb: card-b}, range: {span_s: 3600, step_s: 120}}
      # Network (UnPoller + blackbox)
      - {key: wan_lat, expr: 'max(unpoller_device_wan_latency_seconds) * 1000'}
      - {key: wan_rx, expr: 'max(unpoller_device_wan_receive_rate_bytes)'}
      - {key: wan_tx, expr: 'max(unpoller_device_wan_transmit_rate_bytes)'}
      - {key: wan_rx_1h, expr: 'max(unpoller_device_wan_receive_rate_bytes)', range: {span_s: 3600, step_s: 120}}
      - {key: wan_tx_1h, expr: 'max(unpoller_device_wan_transmit_rate_bytes)', range: {span_s: 3600, step_s: 120}}
      - {key: clients_lan, expr: 'sum(unpoller_site_users{subsystem="lan"})'}
      - {key: clients_wlan, expr: 'sum(unpoller_site_users{subsystem="wlan"})'}
      - {key: aps, expr: 'sum(unpoller_site_aps)'}
      - {key: switches, expr: 'sum(unpoller_site_switches)'}
      - {key: drops24h, expr: 'sum(increase(unpoller_site_intenet_drops_total[24h]))'}
      - {key: tunnel, expr: 'probe_success{job="tunnels"}', label: tunnel}
      - {key: site, expr: 'probe_success{job="sites"}', label: device}
      # Probes
      - {key: machines_up, expr: 'count(probe_success{job="machines"} == 1)'}
      - {key: machines, expr: 'count(probe_success{job="machines"})'}
      - {key: machine, expr: 'probe_success{job="machines"}', label: machine}
      - {key: services_up, expr: 'count(probe_success{job="services"} == 1)'}
      - {key: services, expr: 'count(probe_success{job="services"})'}
      - {key: nas_up, expr: 'count(probe_success{job="nas"} == 1)'}
      - {key: nas, expr: 'count(probe_success{job="nas"})'}
      - {key: checks_bad, expr: 'count(homelab_checks_ok == 0) or vector(0)'}
      - {key: waha, expr: 'waha_api_up', label: server}
      - {key: msgs24h, expr: 'sum by (session) (increase(waha_messages_total{fromMe="false"}[24h]))', label: session}
      - {key: wa_hourly, expr: 'sum(rate(waha_messages_total{fromMe="false"}[1h])) * 3600', range: {span_s: 86400, step_s: 3600}}
      # Storage (NAS node exporter, MinIO)
      - {key: vol_used, expr: 'label_replace(1 - node_filesystem_avail_bytes{cluster="nas",mountpoint=~"/volume[0-9]"} / node_filesystem_size_bytes{cluster="nas",mountpoint=~"/volume[0-9]"}, "vol", "$1", "mountpoint", "/(volume[0-9])")', label: vol}
      - {key: vol_free, expr: 'label_replace(node_filesystem_avail_bytes{cluster="nas",mountpoint=~"/volume[0-9]"}, "vol", "$1", "mountpoint", "/(volume[0-9])")', label: vol}
      - {key: bucket, expr: 'topk(4, nas_minio_bucket_used_bytes / nas_minio_bucket_quota_bytes)', label: bucket}
      # Backups: age in seconds
      - {key: velero_age, expr: 'time() - max by (cluster) (velero_backup_last_successful_timestamp{schedule="velero-daily"})', label: cluster}
      - {key: cnpg_age, expr: 'time() - min by (cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)', label: cluster}
      - {key: vzdump_age, expr: 'time() - max by (node) (pve_backup_last_run_timestamp_seconds)', label: node}

  # v0.2: direct readers. Every host and credential comes from the environment; the hub refuses to start on a missing variable.
  - kind: proxmox
    name: pve
    interval_s: 30
    hosts:
      - {name: pve-a, url: "${PROXMOX_A_URL}", token_id: "${PROXMOX_A_TOKEN_ID}", token_secret: "${PROXMOX_A_TOKEN_SECRET}", insecure: true}
      - {name: pve-b, url: "${PROXMOX_B_URL}", token_id: "${PROXMOX_B_TOKEN_ID}", token_secret: "${PROXMOX_B_TOKEN_SECRET}", insecure: true}
      - {name: pve-c, url: "${PROXMOX_C_URL}", token_id: "${PROXMOX_C_TOKEN_ID}", token_secret: "${PROXMOX_C_TOKEN_SECRET}", insecure: true}

  - kind: kubernetes
    name: k8s
    interval_s: 30
    clusters:
      - {name: cluster-a, in_cluster: true}
      # more clusters: {name: cluster-b, url: "${K8S_B_URL}", token: "${K8S_B_TOKEN}", ca_pem: "${K8S_B_CA}"} (a read-only ServiceAccount each; RBAC in docs/kubernetes-rbac.yaml)

  - kind: unifi_network
    name: net
    url: "${UNIFI_URL}"
    username: "${UNIFI_USERNAME}"
    password: "${UNIFI_PASSWORD}"
    insecure: true
    interval_s: 30

  - kind: uptime_kuma
    name: kuma
    url: "${KUMA_URL}"
    api_key: "${KUMA_API_KEY}"
    interval_s: 60

  - kind: cliproxyapi
    name: ai
    url: "${CLIPROXY_URL}"
    management_key: "${CLIPROXY_MANAGEMENT_KEY}"
    interval_s: 60

  - kind: home_assistant
    name: ha
    url: "${HA_URL}"
    token: "${HA_TOKEN}"
    interval_s: 30
    entities:
      - {id: sensor.living_room_temperature, key: temp}
      - {id: sensor.living_room_humidity, key: humidity}
      - {id: sun.sun, key: sun}
      - {id: todo.shopping_list, key: shopping}

  - kind: technitium
    name: dns
    url: "${TECHNITIUM_URL}"
    token: "${TECHNITIUM_TOKEN}"
    interval_s: 60

  - kind: forgejo
    name: git
    url: "${FORGEJO_URL}"
    token: "${FORGEJO_TOKEN}"
    interval_s: 300

  - kind: github
    name: gh
    user: "${GITHUB_USER}"
    interval_s: 600

  - kind: waha
    name: wa
    interval_s: 60
    servers:
      - {name: line-a, url: "${WAHA_A_URL}", api_key: "${WAHA_A_API_KEY}"}
      - {name: line-b, url: "${WAHA_B_URL}", api_key: "${WAHA_B_API_KEY}"}
      - {name: line-c, url: "${WAHA_C_URL}", api_key: "${WAHA_C_API_KEY}"}

  - kind: homepage
    name: home
    url: "${HOMEPAGE_URL}"
    interval_s: 60

  - kind: homarr
    name: homarr
    url: "${HOMARR_URL}"
    api_key: "${HOMARR_API_KEY}"
    interval_s: 120

  - kind: servarr
    name: media
    interval_s: 60
    apps:
      - {name: movies, kind: radarr, url: "${RADARR_URL}", api_key: "${RADARR_API_KEY}"}
      - {name: tv, kind: sonarr, url: "${SONARR_URL}", api_key: "${SONARR_API_KEY}"}
      - {name: music, kind: lidarr, url: "${LIDARR_URL}", api_key: "${LIDARR_API_KEY}"}
      - {name: indexers, kind: prowlarr, url: "${PROWLARR_URL}", api_key: "${PROWLARR_API_KEY}"}

  - kind: qbittorrent
    name: qbit
    interval_s: 30
    servers:
      - {name: arr, url: "${QBIT_URL}", username: "${QBIT_USERNAME}", password: "${QBIT_PASSWORD}"}

  - kind: job_scout
    name: jobs
    url: "${JOB_SCOUT_URL}"
    token: "${JOB_SCOUT_TOKEN}"
    interval_s: 300

  - kind: x
    name: x
    bearer_token: "${X_BEARER_TOKEN}"
    username: "${X_USERNAME}"
    interval_s: 900

pages:
  - name: overview
    title: Overview
    header: false
    cards:
      - {x: 6, y: 6, w: 118, h: 62, widgets: [
          {kind: text, x: 8, y: 2, text: "{{clock/time}}", font: clock},
          {kind: text, x: 8, y: 44, text: "{{clock/date}}", font: small, color: text2}]}
      - {x: 130, y: 6, w: 184, h: 62, accent: ai, widgets: [
          {kind: gauge, x: 30, y: 40, r: 15, bind: p/claude5h, label: claude 5h, color: ai, thresholds: {warn: 0.4, bad: 0.15, invert: true}},
          {kind: gauge, x: 92, y: 40, r: 15, bind: p/claude7d, label: claude 7d, color: ai, thresholds: {warn: 0.4, bad: 0.15, invert: true}},
          {kind: gauge, x: 154, y: 40, r: 15, bind: p/codex5h, label: codex 5h, color: ai, thresholds: {warn: 0.4, bad: 0.15, invert: true}}]}
      - {x: 6, y: 72, w: 206, h: 74, accent: bitcoin, widgets: [
          {kind: kpi, x: 8, y: 4, bind: btc/price_usd, label: BTC · USD, fmt: thousands, color: bitcoin},
          {kind: kpi, x: 120, y: 4, bind: btc/tip_height, label: block, fmt: thousands, size: mid},
          {kind: kpi, x: 120, y: 36, bind: btc/fee_fast, label: fast fee, unit: sat/vB, fmt: int, size: mid},
          {kind: spark, x: 8, y: 48, w: 100, h: 22, bind: btc/price_24h, color: bitcoin}]}
      - {x: 218, y: 72, w: 96, h: 74, accent: bad, widgets: [
          {kind: kpi, x: 8, y: 4, bind: p/alerts, label: alerts firing, fmt: int, thresholds: {warn: 0.5, bad: 5}},
          {kind: kpi, x: 8, y: 42, bind: p/machines_up, label: machines up, fmt: int, size: mid}]}
      - {x: 6, y: 150, w: 308, h: 16, widgets: [{kind: ticker, x: 6, y: 1, w: 296, color: text2}]}

  - name: ai
    title: AI quota
    cards:
      - {x: 6, y: 24, w: 308, h: 70, accent: ai, widgets: [
          {kind: gauge, x: 30, y: 52, r: 18, bind: p/claude5h, label: claude 5h, color: ai, thresholds: {warn: 0.4, bad: 0.15, invert: true}},
          {kind: gauge, x: 92, y: 52, r: 18, bind: p/claude7d, label: claude 7d, color: ai, thresholds: {warn: 0.4, bad: 0.15, invert: true}},
          {kind: gauge, x: 154, y: 52, r: 18, bind: p/codex5h, label: codex 5h, color: ai, thresholds: {warn: 0.4, bad: 0.15, invert: true}},
          {kind: gauge, x: 216, y: 52, r: 18, bind: p/agent7d, label: agent week, color: ai, thresholds: {warn: 0.4, bad: 0.15, invert: true}},
          {kind: gauge, x: 278, y: 52, r: 18, bind: p/xai7d, label: xai week, color: ai, thresholds: {warn: 0.4, bad: 0.15, invert: true}}]}
      - {x: 6, y: 100, w: 150, h: 64, accent: ai, title: "24 h · requests · tokens", widgets: [
          {kind: rows, x: 8, y: 16, w: 134, row_h: 14, items: [{key: claude}, {key: codex}, {key: xai}],
           cols: [{kind: name, w: 46}, {kind: num, bind: "p/aireq/{}", w: 36, fmt: int}, {kind: num, bind: "p/aitok/{}", w: 40, fmt: auto}]}]}
      - {x: 162, y: 100, w: 152, h: 64, accent: ai, title: requests per hour, widgets: [
          {kind: bars, x: 8, y: 16, w: 136, h: 40, bind: p/ai_req_hourly, color: ai}]}

  - name: websites
    title: Websites
    cards:
      - {x: 6, y: 24, w: 210, h: 140, accent: web, title: "zone · requests · visitors · threats (24 h)", widgets: [
          {kind: rows, x: 8, y: 18, w: 194, row_h: 22, items: [{key: example.com, name: example}, {key: blog.example.com, name: blog}, {key: shop.example.com, name: shop}, {key: app.example.com, name: app}],
           cols: [{kind: name, w: 60}, {kind: num, bind: "p/req24h/{}", w: 50, fmt: auto}, {kind: num, bind: "p/uniq24h/{}", w: 46, fmt: auto}, {kind: num, bind: "p/threats/{}", w: 22, fmt: int, thresholds: {warn: 0.5, bad: 10}}]}]}
      - {x: 222, y: 24, w: 92, h: 60, accent: web, widgets: [
          {kind: text, x: 8, y: 4, text: tunnels up, font: small, color: text2},
          {kind: text, x: 8, y: 18, text: "{{p/tunnels_up|int}} / {{p/tunnels|int}}", font: num}]}
      - {x: 222, y: 90, w: 92, h: 74, accent: web, title: per hour, widgets: [
          {kind: bars, x: 8, y: 16, w: 76, h: 50, bind: p/web_req_hourly, color: web}]}

  - name: bitcoin
    title: Bitcoin
    cards:
      - {x: 6, y: 24, w: 160, h: 70, accent: bitcoin, widgets: [
          {kind: kpi, x: 8, y: 4, bind: btc/price_usd, label: USD, fmt: thousands, color: bitcoin},
          {kind: kpi, x: 96, y: 4, bind: btc/price_eur, label: EUR, fmt: thousands, size: mid},
          {kind: kpi, x: 96, y: 34, bind: btc/hashrate_eh, label: hashrate, fmt: int, unit: EH/s, size: mid},
          {kind: spark, x: 8, y: 46, w: 80, h: 18, bind: btc/price_24h, color: bitcoin}]}
      - {x: 172, y: 24, w: 142, h: 70, accent: bitcoin, title: fees · sat/vB, widgets: [
          {kind: kpi, x: 8, y: 16, bind: btc/fee_fast, label: fast, fmt: int, size: mid},
          {kind: kpi, x: 52, y: 16, bind: btc/fee_half_hour, label: 30 min, fmt: int, size: mid},
          {kind: kpi, x: 96, y: 16, bind: btc/fee_hour, label: 1 h, fmt: int, size: mid},
          {kind: kpi, x: 8, y: 44, bind: btc/mempool_count, label: mempool tx, fmt: auto, size: mid},
          {kind: kpi, x: 80, y: 44, bind: btc/mempool_vsize, label: vsize, fmt: bytes, size: mid}]}
      - {x: 6, y: 100, w: 160, h: 64, accent: bitcoin, title: node, widgets: [
          {kind: kpi, x: 8, y: 18, bind: p/node_blocks, label: height, fmt: thousands, size: mid},
          {kind: kpi, x: 80, y: 18, bind: p/node_peers, label: peers, fmt: int, size: mid, thresholds: {warn: 8, bad: 3, invert: true}},
          {kind: kpi, x: 116, y: 18, bind: p/node_mempool, label: mempool, fmt: auto, size: mid}]}
      - {x: 172, y: 100, w: 142, h: 64, accent: bitcoin, title: difficulty, widgets: [
          {kind: gauge, x: 30, y: 46, r: 15, bind: btc/difficulty_progress, label: epoch, color: bitcoin},
          {kind: kpi, x: 60, y: 14, bind: btc/difficulty_change, label: next change, unit: "%", fmt: dec1, size: mid},
          {kind: kpi, x: 60, y: 40, bind: btc/remaining_blocks, label: blocks left, fmt: int, size: mid}]}

  - name: clusters
    title: Clusters
    cards:
      - {x: 6, y: 24, w: 206, h: 140, accent: net, widgets: [
          {kind: rows, x: 8, y: 4, w: 190, row_h: 22, items: [{key: cluster-a}, {key: cluster-b}, {key: cluster-c}, {key: cluster-d}, {key: cluster-e}, {key: cluster-f}],
           cols: [{kind: led, bind: "p/ready/{}"}, {kind: name, w: 60}, {kind: num, bind: "p/nodes/{}", w: 18, fmt: int}, {kind: num, bind: "p/pods/{}", w: 32, fmt: int}, {kind: bar, bind: "p/mem/{}", w: 56, color: net, thresholds: {warn: 0.8, bad: 0.9}}]}]}
      - {x: 218, y: 24, w: 96, h: 140, accent: bad, title: bad pods · 24 h, widgets: [
          {kind: spark, x: 8, y: 20, w: 80, h: 40, bind: p/badpods_hourly, color: bad},
          {kind: kpi, x: 8, y: 70, bind: p/alerts, label: alerts firing, fmt: int, thresholds: {warn: 0.5, bad: 5}}]}

  - name: hosts
    title: Proxmox hosts
    cards:
      - {x: 6, y: 24, w: 100, h: 140, accent: web, title: host-a, widgets: [
          {kind: gauge, x: 26, y: 50, r: 15, bind: p/hcpu/host-a, label: cpu, color: web, thresholds: {warn: 0.8, bad: 0.9}},
          {kind: gauge, x: 70, y: 50, r: 15, bind: p/hmem/host-a, label: mem, color: web, thresholds: {warn: 0.8, bad: 0.9}},
          {kind: kpi, x: 8, y: 72, bind: p/hnvme/host-a, label: nvme, fmt: temp, size: mid, thresholds: {warn: 60, bad: 70}},
          {kind: kpi, x: 54, y: 72, bind: p/hguests/host-a, label: guests, fmt: int, size: mid},
          {kind: spark, x: 8, y: 106, w: 84, h: 20, bind: p/hcpu_1h/host-a, color: web}]}
      - {x: 110, y: 24, w: 100, h: 140, accent: web, title: host-b, widgets: [
          {kind: gauge, x: 26, y: 50, r: 15, bind: p/hcpu/host-b, label: cpu, color: web, thresholds: {warn: 0.8, bad: 0.9}},
          {kind: gauge, x: 70, y: 50, r: 15, bind: p/hmem/host-b, label: mem, color: web, thresholds: {warn: 0.8, bad: 0.9}},
          {kind: kpi, x: 8, y: 72, bind: p/hnvme/host-b, label: nvme, fmt: temp, size: mid, thresholds: {warn: 60, bad: 70}},
          {kind: kpi, x: 54, y: 72, bind: p/hguests/host-b, label: guests, fmt: int, size: mid},
